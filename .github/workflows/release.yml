name: release
# Publishes the server image and the in-memory test image a client app's tests pin. Clients should
# pin the digest this prints, not the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tag
        id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.v }}
            ghcr.io/${{ github.repository }}:latest
      - name: Test image
        id: test_image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.v }}-test
      - name: The digest to pin
        run: |
          echo "Pin this in a client's tests:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository }}@${{ steps.test_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
